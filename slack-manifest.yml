# Slack App Manifest
# 사용법: https://api.slack.com/apps → "Create New App" → "From an app manifest" → 워크스페이스 선택 → 이 파일 내용 붙여넣기
#
# Socket Mode를 사용하므로 별도의 공개 URL(터널/도메인)이 필요 없습니다.
# 이 방식은 지금(로컬 PC) 뿐 아니라 나중에 클라우드 서버로 옮겨도 그대로 동작합니다.

display_information:
  name: TC Automation Bot
  description: tc-automation TC 생성/수정/컨펌 요청을 처리하는 봇
  background_color: "#1a1a1a"

features:
  bot_user:
    display_name: tc-bot
    always_online: true
  slash_commands:
    - command: /tc-generate
      description: 프로젝트/모듈 기준으로 TC 생성을 요청합니다
      usage_hint: 프로젝트=ABC마트 모듈=장바구니 목표건수=50
      should_escape: false
    - command: /tc-defects
      description: 프로젝트의 결함 현황을 조회/관리합니다
      usage_hint: 프로젝트=ABC마트
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - channels:history
      - groups:history
      - im:history
      - reactions:write
      - files:write
      - app_mentions:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
