display_information:
  name: 큐돌이
  description: tc-automation TC 생성/수정/컨펌 요청을 처리하는 봇
  background_color: "#1a1a1a"

features:
  bot_user:
    display_name: tc-bot
    always_online: true
  slash_commands:
    - command: /tc-generate
      description: 프로젝트/모듈 기준으로 TC 생성을 요청합니다
      usage_hint: 프로젝트='{프로젝트명}' 모듈='{모듈명}' [URL='{URL}']
      should_escape: false
    - command: /tc-defects
      description: 프로젝트의 결함 현황을 조회/관리합니다
      usage_hint: 프로젝트='{프로젝트명}'
      should_escape: false
    - command: /tc-test
      description: 이미 생성된 자동화 테스트를 실행합니다 (Phase 5)
      usage_hint: 프로젝트='{프로젝트명}' 모듈='{모듈명}' [기능='{기능명}'] [TC='{TC_ID}']
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - channels:history
      - groups:history
      - im:history
      - incoming-webhook
      - reactions:write
      - files:write
      - app_mentions:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
