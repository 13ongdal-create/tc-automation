# Slack App Manifest
# 사용법: https://api.slack.com/apps → "Create New App" → "From an app manifest" → 워크스페이스 선택 → 이 파일 내용 붙여넣기
#
# Socket Mode를 사용하므로 별도의 공개 URL(터널/도메인)이 필요 없습니다.
# 이 방식은 지금(로컬 PC) 뿐 아니라 나중에 클라우드 서버로 옮겨도 그대로 동작합니다.

# [수정 전 2026-08-18] 아래는 최초 생성 시점 버전 (앱 이름 영문, 목표건수 포함 usage_hint, incoming-webhook 스코프 누락).
# 실제 라이브 앱은 이후 이름이 "큐돌이"로 변경되고 incoming-webhook 스코프(alert.js 알림용)가 추가되었으며,
# usage_hint도 공백 포함 값을 위해 따옴표 문법으로 변경됨. 문서를 실제 상태에 맞춰 갱신함.
