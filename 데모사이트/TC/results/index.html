<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데모사이트 QA 테스트 실행결과 이력</title>
<style>
  :root{
    --bg:#f6f8fa; --panel:#ffffff; --text:#1f2328; --muted:#656d76;
    --border:#d0d7de; --accent:#0969da; --accent2:#0550ae;
    --pass:#1a7f37; --fail:#cf222e; --headbg:#f6f8fa;
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e;
    --border:#30363d; --accent:#58a6ff; --accent2:#79c0ff; --headbg:#161b22;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;}
  .header-badge{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  header h1{font-size:16px;margin:0;line-height:1.3;}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  button{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;margin-left:auto;}
  .container{padding:20px;max-width:1100px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px;}
  th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;}
  th{background:var(--headbg);font-size:12px;color:var(--muted);}
  tr:last-child td{border-bottom:none;}
  a.viewlink{color:var(--accent);text-decoration:none;font-weight:600;}
  a.viewlink:hover{text-decoration:underline;}
  .rate-pass{color:var(--pass);font-weight:600;}
  .rate-fail{color:var(--fail);font-weight:600;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .footnote{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6;}
</style>
</head>
<body>
<header>
  <div class="header-badge">📜</div>
  <div>
    <h1>데모사이트 QA 테스트 실행결과 이력</h1>
    <div class="sub">Phase 5 테스트 수행 시점별 스냅샷 (하루 단위 누적)</div>
  </div>
  <button id="btnTheme">🌙 다크모드</button>
</header>
<div class="container">
  
  <table>
    <thead>
      <tr><th>실행일</th><th>모듈</th><th>전체</th><th>실행</th><th>Pass</th><th>Fail</th><th>Pass율</th><th>보기</th></tr>
    </thead>
    <tbody>
      
      <tr>
        <td>2026-08-19</td>
        <td>상품전시 (PD)</td>
        <td>56</td>
        <td>11</td>
        <td class="rate-pass">8</td>
        <td class="rate-fail">3</td>
        <td>73%</td>
        <td><a class="viewlink" href="./%EB%8D%B0%EB%AA%A8%EC%82%AC%EC%9D%B4%ED%8A%B8_TC_PD_Result_20260819.html">열기 →</a></td>
      </tr>
    </tbody>
  </table>
  
  <div class="footnote">
    ※ 각 스냅샷은 해당 날짜 Phase 5 테스트 수행 직후 캐노니컬 TC 파일을 복제한 시점 기록입니다 (AGENTS.md 5-1항). 최신 TC 정의/실행결과는 <a class="viewlink" href="../데모사이트_TC_PD.html">데모사이트_TC_PD.html</a>에서 확인하세요.
  </div>
</div>
<script>
document.getElementById('btnTheme').onclick = () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
};
</script>
</body>
</html>
