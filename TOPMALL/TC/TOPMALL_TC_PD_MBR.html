<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPMALL QA TC Viewer — 배치2 (PD+MBR)</title>
<style>
:root{--bg:#f6f8fa;--panel:#fff;--text:#1f2328;--muted:#656d76;--border:#d0d7de;--accent:#1a7f37;--accent2:#116329;--p1:#cf222e;--p2:#9a6700;--p3:#0969da;--headbg:#f6f8fa;--row-hover:#f0f6ff;--tag-bg:#eaf5ea}
[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#848d97;--border:#30363d;--accent:#3fb950;--accent2:#2ea043;--p1:#f85149;--p2:#d29922;--p3:#58a6ff;--headbg:#21262d;--row-hover:#1c2128;--tag-bg:#1a2f1a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
.top-bar{background:var(--headbg);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:0;z-index:100}
.top-bar-inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.project-title{font-size:18px;font-weight:700;color:var(--accent)}
.project-sub{font-size:12px;color:var(--muted)}
.btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;font-weight:500;transition:.15s}
.btn:hover{background:var(--headbg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.spacer{flex:1}
.kpi-bar{display:flex;gap:10px;padding:14px 20px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 18px;min-width:100px;text-align:center}
.kpi-num{font-size:22px;font-weight:700}
.kpi-label{font-size:11px;color:var(--muted);margin-top:2px}
.kpi-p1 .kpi-num{color:var(--p1)}.kpi-p2 .kpi-num{color:var(--p2)}.kpi-p3 .kpi-num{color:var(--p3)}
.stats-wrap{padding:0 20px 10px}
.stats-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:12px}
.stats-table th{background:var(--headbg);padding:7px 12px;text-align:center;border-bottom:1px solid var(--border);font-weight:600}
.stats-table td{padding:6px 12px;text-align:center;border-bottom:1px solid var(--border)}
.stats-table tr:last-child td{border-bottom:none}
.stats-table td:first-child{text-align:left;font-weight:500}
.tab-bar{padding:0 20px 10px;display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:.15s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tc-wrap{padding:0 20px 30px;overflow-x:auto}
table.tc{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
table.tc th{background:var(--headbg);padding:8px;text-align:left;border-bottom:1px solid var(--border);font-weight:600;font-size:11px;white-space:nowrap}
table.tc td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;font-size:12px;word-break:break-word}
table.tc tr:last-child td{border-bottom:none}
table.tc tr:hover td{background:var(--row-hover)}
.col-id{width:90px}.col-cat{width:70px}.col-plat{width:48px}.col-type{width:58px}.col-title{width:200px}.col-pri{width:42px}.col-pre{width:140px}.col-steps{width:170px}.col-expect{width:170px}.col-data{width:110px}.col-result{width:80px}.col-assignee{width:64px}.col-issue{width:100px}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;color:#fff}
.badge.P1{background:var(--p1)}.badge.P2{background:var(--p2)}.badge.P3{background:var(--p3)}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;background:var(--tag-bg);color:var(--accent2);border:1px solid var(--border)}
select.result-sel{width:100%;padding:3px 4px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--text);font-size:11px}
input.inline-input{width:100%;padding:3px 5px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--text);font-size:11px}
pre.tc-pre{white-space:pre-wrap;font-family:inherit;font-size:12px}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <div>
      <div class="project-title">🏷️ TOPMALL TC Viewer</div>
      <div class="project-sub">배치2 — PD(상품) + MBR(회원) · v1.0 · 2026-08-20</div>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="btnCSV">CSV 다운로드</button>
    <button class="btn btn-primary" id="btnSaveJSON">JSON 저장</button>
    <button class="btn" id="btnLoadJSON">JSON 불러오기</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
    <button class="btn" id="btnTheme">🌙 다크모드</button>
  </div>
</div>

<div class="kpi-bar">
  <div class="kpi"><div class="kpi-num" id="kpiTotal">0</div><div class="kpi-label">전체 TC</div></div>
  <div class="kpi kpi-p1"><div class="kpi-num" id="kpiP1">0</div><div class="kpi-label">P1 Critical</div></div>
  <div class="kpi kpi-p2"><div class="kpi-num" id="kpiP2">0</div><div class="kpi-label">P2 Major</div></div>
  <div class="kpi kpi-p3"><div class="kpi-num" id="kpiP3">0</div><div class="kpi-label">P3 Minor</div></div>
  <div class="kpi"><div class="kpi-num" id="kpiPass" style="color:var(--accent)">0</div><div class="kpi-label">Pass</div></div>
  <div class="kpi"><div class="kpi-num" id="kpiFail" style="color:var(--p1)">0</div><div class="kpi-label">Fail</div></div>
  <div class="kpi"><div class="kpi-num" id="kpiBlocked" style="color:var(--p2)">0</div><div class="kpi-label">Blocked</div></div>
</div>

<div class="stats-wrap">
  <table class="stats-table">
    <thead><tr><th>모듈</th><th>전체</th><th>Pass</th><th>Fail</th><th>Blocked</th><th>N/A</th><th>미실행</th><th>수행율</th><th>Pass율</th><th>Fail율</th></tr></thead>
    <tbody id="statsTbody"></tbody>
  </table>
</div>

<div class="tab-bar">
  <div class="tab active" data-tab="ALL">전체</div>
  <div class="tab" data-tab="PD">🏷️ 상품(PD)</div>
  <div class="tab" data-tab="MBR">👤 회원(MBR)</div>
</div>

<div class="tc-wrap">
<table class="tc">
  <thead>
    <tr>
      <th class="col-id">TC ID</th>
      <th class="col-cat">유형</th>
      <th class="col-plat">플랫폼</th>
      <th class="col-pri">우선순위</th>
      <th class="col-title">테스트 항목</th>
      <th class="col-pre">사전조건</th>
      <th class="col-steps">수행절차</th>
      <th class="col-expect">기대결과</th>
      <th class="col-data">테스트 데이터</th>
      <th class="col-result">실행결과</th>
      <th class="col-assignee">담당자</th>
      <th class="col-issue">이슈 요약</th>
    </tr>
  </thead>
  <tbody id="tcTbody"></tbody>
</table>
</div>

let allItems=[...PD_ITEMS,...MBR_ITEMS];
let currentTab='ALL';

function filteredItems(){return currentTab==='ALL'?allItems:allItems.filter(i=>i._module===currentTab);}
function getItem(id){return allItems.find(i=>i.tcId===id);}

function renderTable(){
  const items=filteredItems();
  document.getElementById('tcTbody').innerHTML=items.map(item=>`
    <tr>
      <td><b>${item.tcId}</b><br><small style="color:var(--muted)">${item.category3}</small></td>
      <td><span class="tag">${item.type}</span></td>
      <td>${item.platform}</td>
      <td><span class="badge ${item.priority}">${item.priority}</span></td>
      <td><pre class="tc-pre">${item.title}</pre></td>
      <td><pre class="tc-pre" style="font-size:11px">${item.precondition}</pre></td>
      <td><pre class="tc-pre" style="font-size:11px">${item.steps}</pre></td>
      <td><pre class="tc-pre" style="font-size:11px">${item.expectedResult}</pre></td>
      <td><pre class="tc-pre" style="font-size:11px">${item.testData}</pre></td>
      <td><select class="result-sel" data-id="${item.tcId}"><option value="">미실행</option><option value="Pass" ${item.result==='Pass'?'selected':''}>Pass</option><option value="Fail" ${item.result==='Fail'?'selected':''}>Fail</option><option value="Blocked" ${item.result==='Blocked'?'selected':''}>Blocked</option><option value="N/A" ${item.result==='N/A'?'selected':''}>N/A</option></select></td>
      <td><input class="inline-input" type="text" placeholder="담당자" data-id="${item.tcId}" data-field="assignee" value="${item.assignee}"></td>
      <td><input class="inline-input" type="text" placeholder="이슈요약" data-id="${item.tcId}" data-field="issueSummary" value="${item.issueSummary}"></td>
    </tr>
  `).join('');
  renderKPI();renderStats();
}

function renderKPI(){
  const items=filteredItems();
  document.getElementById('kpiTotal').textContent=items.length;
  document.getElementById('kpiP1').textContent=items.filter(i=>i.priority==='P1').length;
  document.getElementById('kpiP2').textContent=items.filter(i=>i.priority==='P2').length;
  document.getElementById('kpiP3').textContent=items.filter(i=>i.priority==='P3').length;
  document.getElementById('kpiPass').textContent=items.filter(i=>i.result==='Pass').length;
  document.getElementById('kpiFail').textContent=items.filter(i=>i.result==='Fail').length;
  document.getElementById('kpiBlocked').textContent=items.filter(i=>i.result==='Blocked').length;
}

function renderStats(){
  const mods=[{key:'PD',label:'상품(PD)'},{key:'MBR',label:'회원(MBR)'}];
  document.getElementById('statsTbody').innerHTML=mods.map(m=>{
    const items=allItems.filter(i=>i._module===m.key);
    const total=items.length,pass=items.filter(i=>i.result==='Pass').length,fail=items.filter(i=>i.result==='Fail').length,blocked=items.filter(i=>i.result==='Blocked').length,na=items.filter(i=>i.result==='N/A').length,notRun=total-pass-fail-blocked-na,executed=pass+fail+blocked+na;
    return `<tr><td>${m.label}</td><td>${total}</td><td style="color:var(--accent)">${pass}</td><td style="color:var(--p1)">${fail}</td><td style="color:var(--p2)">${blocked}</td><td>${na}</td><td style="color:var(--muted)">${notRun}</td><td>${total?Math.round(executed/total*100):0}%</td><td>${executed?Math.round(pass/executed*100):0}%</td><td>${executed?Math.round(fail/executed*100):0}%</td></tr>`;
  }).join('');
}

document.getElementById('tabBar').addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(!tab)return;
  currentTab=tab.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');renderTable();
});
document.getElementById('tcTbody').addEventListener('change',e=>{
  const sel=e.target.closest('select.result-sel');if(!sel)return;
  const item=getItem(sel.dataset.id);if(item){item.result=sel.value;renderKPI();renderStats();}
});
document.getElementById('tcTbody').addEventListener('input',e=>{
  const inp=e.target.closest('input.inline-input');if(!inp)return;
  const item=getItem(inp.dataset.id);if(item)item[inp.dataset.field]=inp.value;
});
document.getElementById('btnTheme').addEventListener('click',()=>{
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',isDark?'':'dark');
  document.getElementById('btnTheme').textContent=isDark?'🌙 다크모드':'☀️ 라이트모드';
});
document.getElementById('btnCSV').addEventListener('click',()=>{
  const cols=['TC ID','소분류','플랫폼','유형','테스트 항목','우선순위','사전조건','수행절차','기대결과','테스트 데이터','실행결과','담당자','이슈 요약'];
  const rows=allItems.map(i=>[i.tcId,i.category3,i.platform,i.type,i.title,i.priority,i.precondition,i.steps,i.expectedResult,i.testData,i.result,i.assignee,i.issueSummary].map(v=>'"'+(v||'').replace(/"/g,'""').replace(/\n/g,' ')+'"').join(','));
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(cols.join(',')+'\n'+rows.join('\n'));a.download='TOPMALL_TC_PD_MBR.csv';a.click();
});
document.getElementById('btnSaveJSON').addEventListener('click',()=>{
  const json=JSON.stringify({meta:{project:'TOPMALL',modules:['PD','MBR'],savedAt:new Date().toISOString()},items:allItems},null,2);
  const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(json);a.download='TOPMALL_TC_PD_MBR.json';a.click();
});
document.getElementById('btnLoadJSON').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      (data.items||[]).forEach(loaded=>{
        const existing=allItems.find(i=>i.tcId===loaded.tcId);
        if(existing){existing.result=loaded.result||'';existing.assignee=loaded.assignee||'';existing.issueSummary=loaded.issueSummary||'';}
      });
      renderTable();alert('불러오기 완료');
    }catch(err){alert('파일 오류: '+err.message);}
    e.target.value='';
  };
  reader.readAsText(file,'utf-8');
});
renderTable();
</script>
